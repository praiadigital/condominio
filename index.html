<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Condomínio — sua taxa está cara? Descubra agora</title>
<meta name="description" content="Analisador de taxa condominial no litoral: custo por m², custos ocultos e impacto na rentabilidade. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fdf4ff;color:#4a044e;min-height:100vh}
header{padding:24px;text-align:center;background:linear-gradient(120deg,#86198f,#c026d3);color:#fff}
nav a{color:#fdf4ff;margin:0 8px;text-decoration:none;font-size:14px;font-weight:600}
.wrap{max-width:700px;margin:auto;padding:24px}
.panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 6px 18px rgba(134,25,143,.12)}
label{display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;padding:12px;border-radius:10px;border:2px solid #f0abfc;font-size:16px}
.veredito{text-align:center;font-size:20px;font-weight:800;border-radius:12px;padding:18px;margin-top:14px}
.barra{background:#fdf4ff;border-radius:99px;height:16px;overflow:hidden;margin:10px 0}
.barra div{height:100%;transition:width .4s}
.tab{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tab td{padding:8px;border-bottom:1px dashed #f0abfc}
footer{padding:20px;text-align:center;font-size:13px}
footer a{color:#86198f}
</style></head>
<body>
<header><h1>🏢 Condomínio</h1><p>Taxa cara ou justa? Analise antes de comprar ou anunciar</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/calculadora-custos">Calc. Custos</a><a href="https://praia.digital/casa-vs-ape">Casa vs Apê</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap">
<div class="panel">
<label>💰 Taxa de condomínio mensal (R$)</label><input type="number" id="taxa" value="900" oninput="calc()">
<label>📐 Área do imóvel (m²)</label><input type="number" id="area" value="70" oninput="calc()">
<label>🛏️ Renda líquida de temporada/mês (R$)</label><input type="number" id="renda" value="4500" oninput="calc()">
<div class="veredito" id="veredito"></div><div class="barra"><div id="bar"></div></div></div>
<div class="panel"><h2>🔍 O que a taxa come do seu lucro</h2><table class="tab" id="tab"></table></div>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/fluxo-caixa">Fluxo de Caixa</a> · <a href="https://praia.digital/calculadora-temporada">Calc. Temporada</a> · <a href="https://praia.digital/checklists-litoral">Checklists</a></footer>
<script>
function fmt(v){return 'R$ '+Math.round(v).toLocaleString('pt-BR')}
function calc(){
const t=+taxa.value,a=+area.value||1,r=+renda.value;
const m2=t/a;
let v,c;
if(m2<8){v='✅ Excelente — taxa enxuta';c='#16a34a'}
else if(m2<14){v='🟡 Na média do litoral';c='#ca8a04'}
else{v='🔴 Alta — pese na conta antes de comprar';c='#dc2626'}
veredito.textContent=`${fmt(m2)}/m² — ${v}`;veredito.style.color=c;
bar.style.width=Math.min(100,m2/20*100)+'%';bar.style.background=c;
const pctR=r>0?t/r*100:0;
tab.innerHTML=`<tr><td>Condomínio/ano</td><td><b>${fmt(t*12)}</b></td></tr><tr><td>% da renda de temporada</td><td><b>${pctR.toFixed(0)}%</b></td></tr><tr><td>Diárias necessárias só p/ pagar o condomínio (diária R$ 600)</td><td><b>${Math.ceil(t/600)}</b></td></tr><tr><td>Em 10 anos (com reajuste 7%/ano)</td><td><b>${fmt(t*12*((Math.pow(1.07,10)-1)/0.07))}</b></td></tr>`;}
calc();
</script></body></html>
